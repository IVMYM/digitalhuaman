# 放到已有 nginx 的站点里。80/443 仍由宿主机 nginx 占用。
# 本服务只监听 127.0.0.1:18200。请用独立域名，不要挂在子路径。
#
# SSE（对话测试、LiveTalking 流式回复）必须关闭代理缓冲。

server {
    listen 443 ssl;
    server_name dh-admin.example.com;

    # ssl_certificate     /etc/letsencrypt/live/dh-admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dh-admin.example.com/privkey.pem;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
